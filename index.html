
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A real-time weather dashboard to check temperature, humidity and wind speed.">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard">

        <header class="header">
            <h1>Weather Dashboard</h1>
            <p>Discover the weather in your city</p>
        </header>

        <section class="search-section">
            <form id="weatherForm">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    aria-label="Enter city name"
                    required
                >

                <button type="submit" id="searchBtn">
                    Search
                </button>
            </form>
        </section>

        <p id="message" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section id="weatherDisplay" class="weather-card hidden">

            <div class="weather-heading">
                <div>
                    <h2 id="cityName">City</h2>
                    <p id="weatherDescription">Weather condition</p>
                </div>

                <div id="weatherIcon" class="weather-icon">
                    ☀️
                </div>
            </div>

            <div class="temperature">
                <span id="temperature">--</span>
                <span class="degree">°C</span>
            </div>

            <div class="weather-details">

                <div class="detail">
                    <span class="detail-icon">💧</span>
                    <div>
                        <p>Humidity</p>
                        <h3 id="humidity">--%</h3>
                    </div>
                </div>

                <div class="detail">
                    <span class="detail-icon">💨</span>
                    <div>
                        <p>Wind Speed</p>
                        <h3 id="windSpeed">-- km/h</h3>
                    </div>
                </div>

            </div>

            <p class="updated">
                Updated: <span id="updatedTime">--</span>
            </p>

        </section>

        <footer>
            <p>Weather data powered by Open-Meteo</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
